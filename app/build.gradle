plugins { id 'com.android.application' }
android { namespace 'com.adventureoracle.bot'; compileSdk 35
    defaultConfig { applicationId 'com.adventureoracle.bot'; minSdk 26; targetSdk 28; versionCode 7; versionName '0.7-alpha' }
}

dependencies { implementation "androidx.core:core:1.12.0"
    implementation "com.google.mlkit:text-recognition:16.0.1" }

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
