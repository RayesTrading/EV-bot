
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          if [ -f AdventureOracleAndroidBot/settings.gradle ]; then
            cd AdventureOracleAndroidBot
          fi
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-bot-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            AdventureOracleAndroidBot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
